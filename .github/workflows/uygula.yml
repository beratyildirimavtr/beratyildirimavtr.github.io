name: Uygula (tek seferlik)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  uygula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Betigi calistir
        run: |
          test -f uygula.py || { echo "HATA: uygula.py dosyasi ana klasorde yok. Once onu yukleyin."; exit 1; }
          python3 uygula.py
          rm -f uygula.py

      - name: Kaydet ve siteyi yeniden yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "SEO duzenlemesi: basliklar, aciklamalar, bolum basliklari, konu baglantilari, simgeler"
            git push
            gh workflow run yayinla.yml
          fi
